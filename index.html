<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b25">
  <meta name="description" content="江小唐给夏鸣的一封圣诞来信。愿冬夜有雪，心里有光。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="江小唐给夏鸣的圣诞祝福">
  <meta property="og:description" content="愿这个冬天的每一个小小愿望，都有温柔回应。">
  <title>江小唐给夏鸣的圣诞祝福</title>
  <link rel="preload" href="winter-letter.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face {
      font-family: "Winter Letter";
      src: url("winter-letter.ttf") format("truetype");
      font-display: swap;
      font-weight: 400;
    }
    :root {
      color-scheme: dark;
      --night: #101b25;
      --deep: #12252c;
      --pine: #526d58;
      --pine-light: #759477;
      --snow: #f4f5ee;
      --mist: #c4d0d0;
      --gold: #e7c987;
      --soft-gold: #d9bd83;
      --muted: #a5b6b9;
      --rule: rgb(233 239 231 / 14%);
      --page-width: 1320px;
      --page-pad: 7.3vw;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--night);
    }

    body {
      margin: 0;
      background: var(--night);
      color: var(--snow);
      font-family: "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, a { font: inherit; }

    a { color: inherit; }

    .hero {
      position: relative;
      display: grid;
      min-height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 77% 44%, rgb(43 74 77 / 35%), transparent 42%),
        linear-gradient(116deg, #101b25 4%, #13262e 57%, #17272c 100%);
    }

    .scene {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hero::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(90deg, rgb(16 27 37 / 66%) 0%, rgb(16 27 37 / 30%) 44%, transparent 76%);
      content: "";
      pointer-events: none;
    }

    .masthead, .hero-copy, .hero-bottom {
      width: min(calc(100% - 2 * var(--page-pad)), var(--page-width));
      margin-inline: auto;
    }

    .masthead {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
      transform: translateX(-50%);
      border-bottom: 1px solid var(--rule);
    }

    .edition {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgb(244 245 238 / 70%);
      font-size: 12px;
      letter-spacing: 1.5px;
    }

    .edition-mark {
      width: 8px;
      height: 8px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 14px rgb(231 201 135 / 44%);
    }

    .masthead-note {
      color: rgb(244 245 238 / 56%);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .sound-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      border: 0;
      padding: 0 0 0 12px;
      background: transparent;
      color: var(--mist);
      cursor: pointer;
      font-size: 12px;
      letter-spacing: .5px;
    }
    .sound-button:hover { color: var(--gold); }
    .sound-button:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    .sound-bars { display: flex; align-items: center; gap: 3px; height: 16px; }
    .sound-bars i { display: block; width: 2px; height: 5px; background: currentColor; }
    .sound-bars i:nth-child(2) { height: 13px; }
    .sound-bars i:nth-child(3) { height: 9px; }
    .sound-button[aria-pressed="true"] .sound-bars i { animation: music 1s ease-in-out infinite alternate; }
    .sound-button[aria-pressed="true"] .sound-bars i:nth-child(2) { animation-delay: -.4s; }
    .sound-button[aria-pressed="true"] .sound-bars i:nth-child(3) { animation-delay: -.7s; }
    @keyframes music { to { transform: scaleY(.4); } }
    @keyframes arrival { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: no-preference) {
      .recipient { animation: arrival 1s both; }
      h1 { animation: arrival 1.1s .12s both; }
      .hero-subtitle { animation: arrival 1.1s .25s both; }
      .hero-actions { animation: arrival 1.1s .38s both; }
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      align-self: center;
      align-items: flex-start;
      padding-top: 66px;
      padding-bottom: 102px;
    }

    .recipient {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 25px;
      color: var(--soft-gold);
      font-size: 13px;
      letter-spacing: 2px;
    }

    .recipient::before {
      width: 30px;
      height: 1px;
      background: var(--soft-gold);
      content: "";
    }

    h1 {
      margin: 0;
      color: var(--snow);
      font-size: 68px;
      font-family: "Winter Letter", "Hiragino Sans GB", sans-serif;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.34;
      text-wrap: pretty;
    }

    h1 span { display: block; }

    .hero-subtitle {
      max-width: 440px;
      margin: 24px 0 0;
      color: rgb(228 235 231 / 79%);
      font-size: 16px;
      line-height: 2;
      letter-spacing: 0;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px 25px;
      margin-top: 34px;
    }

    .light-button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 0 19px;
      border: 1px solid rgb(231 201 135 / 72%);
      border-radius: 2px;
      background: rgb(231 201 135 / 9%);
      color: var(--snow);
      cursor: pointer;
      transition: background 220ms ease, border-color 220ms ease, transform 220ms ease;
    }

    .light-button:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
      background: rgb(231 201 135 / 17%);
    }

    .light-button:active { transform: translateY(0) scale(.98); }

    .light-button:focus-visible, .text-link:focus-visible, .share-button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .light-symbol {
      position: relative;
      width: 15px;
      height: 15px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      box-shadow: inset 0 0 0 3px rgb(231 201 135 / 20%);
    }

    .light-symbol::after {
      position: absolute;
      inset: 4px;
      border-radius: inherit;
      background: var(--gold);
      content: "";
    }

    .text-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      gap: 8px;
      color: rgb(244 245 238 / 74%);
      text-decoration: none;
      transition: color 180ms ease;
    }

    .text-link:hover { color: var(--gold); }

    .text-link span {
      color: var(--gold);
      font-size: 20px;
      line-height: 1;
    }

    .hero-bottom {
      position: absolute;
      bottom: 26px;
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      transform: translateX(-50%);
      color: rgb(224 233 229 / 60%);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .hero-bottom span:last-child { color: rgb(231 201 135 / 78%); }

    .letter {
      position: relative;
      display: grid;
      min-height: 500px;
      place-items: center;
      padding: 104px var(--page-pad) 96px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 100%, rgb(54 82 70 / 23%), transparent 50%),
        linear-gradient(180deg, #14252c, #102029);
      text-align: center;
    }

    .letter::before, .letter::after {
      position: absolute;
      left: 50%;
      width: 1px;
      height: 42px;
      background: linear-gradient(var(--gold), transparent);
      content: "";
    }

    .letter::before { top: 0; }
    .letter::after { bottom: 0; transform: rotate(180deg); }

    .letter-inner { width: min(100%, 760px); }

    .letter-kicker {
      margin: 0 0 25px;
      color: var(--soft-gold);
      font-size: 12px;
      letter-spacing: 2px;
    }

    h2 {
      margin: 0;
      color: var(--snow);
      font-family: "Winter Letter", "Hiragino Sans GB", sans-serif;
      font-size: 42px;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0;
    }

    .letter-copy {
      max-width: 560px;
      margin: 23px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 2.1;
    }

    .signature {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 35px 0 0;
      color: var(--snow);
      font-size: 15px;
      letter-spacing: 2px;
    }

    .signature::before, .signature::after {
      width: 32px;
      height: 1px;
      background: rgb(231 201 135 / 62%);
      content: "";
    }

    .share-row {
      display: flex;
      justify-content: center;
      margin-top: 36px;
    }

    .share-button {
      padding: 8px 10px;
      border: 0;
      background: transparent;
      color: rgb(196 208 208 / 76%);
      cursor: pointer;
      font-size: 13px;
      text-decoration: underline;
      text-decoration-color: rgb(196 208 208 / 38%);
      text-underline-offset: 5px;
      transition: color 180ms ease;
    }

    .share-button:hover { color: var(--gold); }

    .footer {
      display: flex;
      justify-content: center;
      padding: 22px 20px 27px;
      border-top: 1px solid var(--rule);
      background: #102029;
      color: rgb(196 208 208 / 50%);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .toast {
      position: fixed;
      z-index: 5;
      right: 24px;
      bottom: 24px;
      max-width: min(340px, calc(100vw - 32px));
      padding: 13px 17px;
      border: 1px solid rgb(231 201 135 / 55%);
      background: #172a30;
      color: var(--snow);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 760px) {
      :root { --page-pad: 24px; }

      .hero { min-height: 100dvh; min-height: max(760px, 100dvh); }

      .masthead { height: 68px; }

      .edition { font-size: 11px; letter-spacing: 1px; }

      .masthead-note { font-size: 11px; }

      .hero-copy {
        align-self: start;
        padding-top: 142px;
        padding-bottom: 210px;
      }

      .recipient { margin-bottom: 18px; font-size: 12px; }

      h1 { font-size: 49px; line-height: 1.42; }

      .hero-subtitle { max-width: 330px; margin-top: 18px; font-size: 14px; line-height: 1.9; }

      .hero-actions { gap: 10px 18px; margin-top: 23px; }

      .light-button { min-height: 46px; padding-inline: 15px; font-size: 14px; }

      .text-link { font-size: 14px; }

      .hero::after {
        background: linear-gradient(180deg, rgb(16 27 37 / 8%) 0%, rgb(16 27 37 / 12%) 43%, rgb(16 27 37 / 15%) 64%, rgb(16 27 37 / 48%) 100%);
      }

      .hero-bottom { bottom: 22px; font-size: 10px; }

      .letter { min-height: 480px; padding: 82px 25px 76px; }

      .letter-kicker { margin-bottom: 18px; font-size: 11px; }

      h2 { font-size: 30px; line-height: 1.75; }

      .letter-copy { margin-top: 18px; font-size: 14px; }

      .toast { right: 16px; bottom: 16px; }
    }

    @media (max-width: 390px) {
      h1 { font-size: clamp(32px, 11.3vw, 45px); }
      .hero-copy { padding-top: 128px; }
      .hero-actions { align-items: flex-start; flex-direction: column; }
      .hero-bottom { letter-spacing: .3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="greeting-title">
      <canvas class="scene" aria-hidden="true"></canvas>

      <header class="masthead">
        <div class="edition"><span>江小唐的冬日邮局</span></div>
        <button class="sound-button" type="button" aria-pressed="false" aria-label="播放圣诞音乐">
          <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="sound-label">听见圣诞</span>
        </button>
      </header>

      <div class="hero-copy">
        <p class="recipient">致 夏鸣</p>
        <h1 id="greeting-title"><span>江小唐给夏鸣的</span><span>圣诞祝福</span></h1>
        <p class="hero-subtitle" aria-live="polite">把冬夜的星星挂上枝头，把想对你说的话，藏进这棵圣诞树里。</p>
        <div class="hero-actions">
          <button class="light-button" type="button" aria-pressed="false">
            <span class="light-symbol" aria-hidden="true"></span>
            <span class="light-label">点亮这棵树</span>
          </button>
          <a class="text-link" href="#letter">读一读这封信 <span aria-hidden="true">↘</span></a>
        </div>
      </div>

    </section>

    <section class="letter" id="letter" aria-labelledby="letter-title">
      <div class="letter-inner">
        <h2 id="letter-title">愿你被喜欢的事物包围，<br>也总能遇见温柔的人。</h2>
        <p class="letter-copy">愿忙碌的日子里，有值得期待的小事；愿每个平凡的清晨，都能遇见一点好消息。新的一年，愿你心里有光，脚下有路，身边有惦记你的人。</p>
        <p class="signature">江小唐</p>
        <div class="share-row">
          <button class="share-button" type="button">把这份祝福分享给夏鸣</button>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer">圣诞快乐，夏鸣。</footer>
  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const canvas = document.querySelector(".scene");
      const ctx = canvas.getContext("2d");
      const hero = document.querySelector(".hero");
      const lightButton = document.querySelector(".light-button");
      const lightLabel = document.querySelector(".light-label");
      const shareButton = document.querySelector(".share-button");
      const toast = document.querySelector(".toast");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const colors = ["#efcf85", "#f3e2b2", "#df8177", "#e7efdf", "#c4d8cf"];
      const flakes = [];
      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let lightsOn = false;
      let frame = 0;
      let toastTimer;
      let sceneVisible = true;
      let lightStrength = 0;

      function seededRandom(seed) {
        let value = seed;
        return () => {
          value = (value * 16807) % 2147483647;
          return (value - 1) / 2147483646;
        };
      }

      function resize() {
        const bounds = hero.getBoundingClientRect();
        width = bounds.width;
        height = bounds.height;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * pixelRatio);
        canvas.height = Math.floor(height * pixelRatio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        makeFlakes();
        paint(0);
      }

      function makeFlakes() {
        const random = seededRandom(2048);
        const count = Math.max(42, Math.round(width * height / 9000));
        flakes.length = 0;
        for (let i = 0; i < count; i += 1) {
          flakes.push({
            x: random() * width,
            y: random() * height,
            radius: .55 + random() * 1.8,
            speed: .12 + random() * .48,
            drift: .12 + random() * .45,
            phase: random() * Math.PI * 2,
            alpha: .19 + random() * .55
          });
        }
      }

      function path(points, fill) {
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i][0], points[i][1]);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
      }

      function drawStars(time) {
        const random = seededRandom(19);
        const count = Math.round(width / 10);
        for (let i = 0; i < count; i += 1) {
          const x = random() * width;
          const y = random() * height * .7;
          const pulse = .37 + .32 * Math.sin(time * .0006 + i * 1.7);
          ctx.globalAlpha = pulse;
          ctx.fillStyle = i % 9 === 0 ? "#e8cd91" : "#d8e3dd";
          ctx.beginPath();
          ctx.arc(x, y, i % 8 === 0 ? 1.25 : .75, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawMoon() {
        const x = width * (width < 760 ? .84 : .9);
        const y = height * (width < 760 ? .17 : .2);
        const r = width < 760 ? 22 : 32;
        const glow = ctx.createRadialGradient(x, y, r * .2, x, y, r * 3.4);
        glow.addColorStop(0, "rgb(224 216 183 / 18%)");
        glow.addColorStop(1, "rgb(224 216 183 / 0%)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, r * 3.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#e6dfc3";
        ctx.globalAlpha = .85;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(x + r * .45, y - r * .32, r * .9, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
      }

      function drawHills() {
        ctx.fillStyle = "#172b30";
        ctx.beginPath();
        ctx.moveTo(0, height * .77);
        ctx.quadraticCurveTo(width * .2, height * .69, width * .38, height * .78);
        ctx.quadraticCurveTo(width * .63, height * .89, width * .83, height * .75);
        ctx.quadraticCurveTo(width * .92, height * .7, width, height * .76);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        const ground = ctx.createLinearGradient(0, height * .82, 0, height);
        ground.addColorStop(0, "#cad2c7");
        ground.addColorStop(.16, "#e7e8d9");
        ground.addColorStop(1, "#b5c4bb");
        ctx.fillStyle = ground;
        ctx.beginPath();
        ctx.moveTo(0, height * .87);
        ctx.quadraticCurveTo(width * .22, height * .81, width * .45, height * .88);
        ctx.quadraticCurveTo(width * .71, height * .98, width, height * .84);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "rgb(255 255 255 / 24%)";
        ctx.beginPath();
        ctx.ellipse(width * .76, height * .91, width * .2, height * .055, -.035, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawVillage() {
        const random = seededRandom(671);
        const horizon = height * .87;
        // Layered forest silhouettes give the snow scene a sense of distance.
        for (let i = 0; i < 33; i += 1) {
          const x = random() * width;
          const h = height * (.035 + random() * .12);
          const y = horizon - Math.sin(x / width * 5) * height * .018;
          for (let tier = 0; tier < 4; tier += 1) {
            const top = y - h + tier * h * .17;
            const half = h * (.12 + tier * .038);
            path([[x, top], [x + half, top + h * .45], [x - half, top + h * .45]], i % 2 ? "#294044" : "#23383c");
          }
        }
        const s = Math.min(width / 1300, height / 760) * (width < 760 ? 1.8 : 1);
        const cx = width * (width < 760 ? .22 : .53);
        const cy = height * .871;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(s, s);
        ctx.fillStyle = "#536062";
        ctx.fillRect(-43, -43, 86, 43);
        path([[-58, -40], [0, -85], [56, -40]], "#293d42");
        path([[-59, -42], [0, -88], [57, -43], [46, -44], [0, -76], [-47, -40]], "#c5d3cb");
        ctx.fillStyle = "#475255";
        ctx.fillRect(25, -84, 10, 29);
        ctx.fillStyle = "#c5d3cb";
        ctx.fillRect(23, -86, 14, 5);
        for (const wx of [-25, 20]) {
          ctx.fillStyle = "#efcd87";
          ctx.shadowColor = "#f1cb7c";
          ctx.shadowBlur = 20;
          ctx.fillRect(wx, -33, 13, 18);
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#626260";
          ctx.fillRect(wx + 6, -33, 1, 18);
          ctx.fillRect(wx, -25, 13, 1);
        }
        ctx.fillStyle = "#2b3c3d";
        ctx.fillRect(-3, -27, 13, 27);
        ctx.restore();
      }

      function treeGeometry() {
        const mobile = width < 760;
        const treeHeight = mobile ? height * (width < 360 ? .38 : .43) : Math.min(height * .69, width * .48);
        const centerX = mobile ? width * .72 : width * .77;
        const baseY = mobile ? height * .91 : height * .91;
        return { centerX, baseY, treeHeight, treeWidth: treeHeight * .72 };
      }

      function drawTree(time) {
        const { centerX: x, baseY, treeHeight: th, treeWidth: tw } = treeGeometry();
        const topY = baseY - th;
        const groundShade = ctx.createRadialGradient(x, baseY, 2, x, baseY, tw * 1.5);
        groundShade.addColorStop(0, "rgb(21 39 39 / 36%)");
        groundShade.addColorStop(1, "rgb(21 39 39 / 0%)");
        ctx.fillStyle = groundShade;
        ctx.beginPath();
        ctx.ellipse(x, baseY + 2, tw * 1.65, th * .07, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#604c3a";
        ctx.fillRect(x - tw * .045, baseY - th * .19, tw * .09, th * .21);

        const random = seededRandom(1125);
        for (let layer = 8; layer >= 0; layer -= 1) {
          const startY = topY + th * (.09 + layer * .075);
          const layerHeight = th * (.15 + layer * .016);
          const half = tw * (.065 + layer * .052);
          const foliage = ctx.createLinearGradient(x - half, startY, x + half, startY + layerHeight);
          foliage.addColorStop(0, "#6f927e");
          foliage.addColorStop(.4, "#456c58");
          foliage.addColorStop(1, "#254c40");
          ctx.beginPath();
          ctx.moveTo(x, startY);
          ctx.bezierCurveTo(x + half * .25, startY + layerHeight * .4, x + half * .56, startY + layerHeight * .86, x + half, startY + layerHeight * .84);
          for (let cut = 12; cut >= -12; cut -= 1) {
            const f = cut / 12;
            const dip = (1 - Math.abs(f)) * layerHeight * .16;
            ctx.lineTo(x + half * f, startY + layerHeight * .84 + dip + random() * th * .022);
          }
          ctx.bezierCurveTo(x - half * .56, startY + layerHeight * .86, x - half * .25, startY + layerHeight * .4, x, startY);
          ctx.closePath();
          ctx.fillStyle = foliage;
          ctx.fill();
          // Fine, irregular needle strokes keep the tree from reading as stacked triangles.
          for (let needle = 0; needle < 32; needle += 1) {
            const side = needle % 2 ? -1 : 1;
            const f = .22 + random() * .7;
            const nx = x + half * f * side;
            const ny = startY + layerHeight * (.4 + f * .47);
            ctx.beginPath();
            ctx.moveTo(nx - side * th * .018, ny - th * .016);
            ctx.lineTo(nx + side * th * .015, ny + th * .018);
            ctx.strokeStyle = needle % 3 ? "rgb(145 179 151 / 24%)" : "rgb(21 61 48 / 42%)";
            ctx.lineWidth = th * .002;
            ctx.stroke();
          }
          // Snow rests on outward boughs in soft, tapered patches.
          for (const side of [-1, 1]) {
            const sx = x + side * half * .49;
            const sy = startY + layerHeight * .64;
            ctx.beginPath();
            ctx.moveTo(sx - side * half * .28, sy - th * .015);
            ctx.quadraticCurveTo(sx, sy - th * .002, x + side * half * .92, startY + layerHeight * .81);
            ctx.quadraticCurveTo(sx + side * half * .15, sy + th * .035, sx - side * half * .28, sy - th * .015);
            ctx.fillStyle = layer % 2 ? "#bfd0c3" : "#d2ddd0";
            ctx.fill();
          }
        }

        if (lightStrength > .01) {
          const glow = ctx.createRadialGradient(x, topY + th * .55, 0, x, topY + th * .55, th * .6);
          glow.addColorStop(0, `rgba(241,194,105,${lightStrength * .13})`);
          glow.addColorStop(1, "rgba(241,194,105,0)");
          ctx.fillStyle = glow;
          ctx.fillRect(x - th, topY - th * .1, th * 2, th * 1.2);
        }

        drawGarlands(x, topY, th, tw, time);
        drawOrnaments(x, topY, th, tw, time);
        drawStar(x, topY + th * .045, th * .06, time);
      }

      function drawGarlands(x, topY, th, tw, time) {
        const rows = 5;
        for (let row = 0; row < rows; row += 1) {
          const y = topY + th * (.27 + row * .137);
          const half = tw * (.09 + row * .084);
          const dip = th * .053;
          ctx.beginPath();
          ctx.moveTo(x - half, y);
          ctx.quadraticCurveTo(x - half * .25, y + dip * 1.5, x, y + dip);
          ctx.quadraticCurveTo(x + half * .25, y + dip * .5, x + half, y - th * .005);
          ctx.strokeStyle = lightsOn ? "rgb(242 214 151 / 76%)" : "rgb(213 188 132 / 48%)";
          ctx.lineWidth = Math.max(1, th * .003);
          ctx.shadowColor = lightsOn ? "rgb(251 214 137 / 76%)" : "transparent";
          ctx.shadowBlur = lightsOn ? 9 : 0;
          ctx.stroke();
          ctx.shadowBlur = 0;

          const bulbs = 9 + row * 2;
          for (let bulb = 0; bulb <= bulbs; bulb += 1) {
            const t = bulb / bulbs;
            const bx = x - half + t * half * 2;
            const by = y + Math.sin(t * Math.PI) * dip * 1.13 - t * th * .006;
            const color = colors[(bulb + row * 3) % colors.length];
            const pulse = lightsOn ? .8 + .2 * Math.sin(time * .002 + bulb * .7 + row) : .54;
            ctx.globalAlpha = pulse;
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 3 + lightStrength * 20;
            ctx.beginPath();
            ctx.arc(bx, by, th * (.004 + lightStrength * .003), 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }
          ctx.globalAlpha = 1;
        }
      }

      function drawOrnaments(x, topY, th, tw, time) {
        const ornaments = [
          [.49, .31, .019, "#d88472"], [.64, .36, .015, "#e4cf9e"], [.35, .43, .016, "#c8d8c8"],
          [.54, .49, .021, "#d88472"], [.31, .58, .018, "#e2ca8f"], [.72, .61, .016, "#df8c76"],
          [.46, .68, .019, "#d7dfd0"], [.65, .75, .021, "#d6ba7b"], [.29, .78, .017, "#db8174"]
        ];
        for (let i = 0; i < ornaments.length; i += 1) {
          const [fraction, yFraction, size, color] = ornaments[i];
          const side = i % 2 === 0 ? -1 : 1;
          const radius = th * size;
          const ox = x + side * tw * (.06 + Math.abs(fraction - .5)) * yFraction;
          const oy = topY + th * yFraction;
          const gradient = ctx.createRadialGradient(ox - radius * .3, oy - radius * .35, 0, ox, oy, radius * 1.2);
          gradient.addColorStop(0, "#fff4d8");
          gradient.addColorStop(.23, color);
          gradient.addColorStop(1, color);
          ctx.fillStyle = gradient;
          ctx.shadowColor = lightsOn ? color : "transparent";
          ctx.shadowBlur = lightsOn ? 10 : 0;
          ctx.beginPath();
          ctx.arc(ox, oy, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      function drawStar(x, y, radius, time) {
        const points = 5;
        const twinkle = lightsOn ? .92 + Math.sin(time * .004) * .08 : .72;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(1, twinkle);
        ctx.rotate(-Math.PI / 2);
        ctx.beginPath();
        for (let i = 0; i < points * 2; i += 1) {
          const r = i % 2 === 0 ? radius : radius * .43;
          const angle = i * Math.PI / points;
          const px = Math.cos(angle) * r;
          const py = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = "#f0d99c";
        ctx.shadowColor = "#f3d990";
        ctx.shadowBlur = lightsOn ? 24 : 11;
        ctx.fill();
        ctx.restore();
        ctx.shadowBlur = 0;
      }

      function drawGifts() {
        const { centerX: x, baseY, treeHeight: th } = treeGeometry();
        const gifts = [
          { x: x - th * .17, y: baseY - th * .045, w: th * .22, h: th * .13, color: "#9a6560", ribbon: "#e5c987" },
          { x: x + th * .04, y: baseY - th * .03, w: th * .2, h: th * .12, color: "#cfbea1", ribbon: "#a36059" },
          { x: x - th * .02, y: baseY - th * .015, w: th * .15, h: th * .095, color: "#708775", ribbon: "#e7d39f" }
        ];
        for (const gift of gifts) {
          ctx.fillStyle = gift.color;
          ctx.fillRect(gift.x, gift.y, gift.w, gift.h);
          ctx.fillStyle = gift.ribbon;
          ctx.fillRect(gift.x + gift.w * .45, gift.y, gift.w * .1, gift.h);
          ctx.fillRect(gift.x, gift.y + gift.h * .25, gift.w, gift.h * .08);
          ctx.strokeStyle = gift.ribbon;
          ctx.lineWidth = th * .007;
          for (const direction of [-1, 1]) {
            ctx.beginPath();
            ctx.ellipse(gift.x + gift.w * (.5 + direction * .12), gift.y - gift.h * .055, gift.w * .14, gift.h * .07, direction * .4, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      }

      function drawSnowCat() {
        const { centerX: x, baseY, treeHeight: th } = treeGeometry();
        const s = th * .15;
        ctx.save();
        ctx.translate(x - th * .38, baseY + th * .025);
        ctx.fillStyle = "rgb(26 49 49 / 18%)";
        ctx.beginPath(); ctx.ellipse(0, 1, s * .55, s * .13, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#dce3d4";
        ctx.beginPath(); ctx.ellipse(0, -s * .32, s * .36, s * .43, 0, 0, Math.PI * 2); ctx.fill();
        path([[-s * .3, -s * .54], [-s * .31, -s * .91], [-s * .03, -s * .69]], "#e9ebdf");
        path([[s * .3, -s * .54], [s * .31, -s * .91], [s * .03, -s * .69]], "#e9ebdf");
        ctx.fillStyle = "#e9ebdf";
        ctx.beginPath(); ctx.ellipse(0, -s * .59, s * .35, s * .28, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#526263";
        for (const side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(side * s * .13, -s * .59, s * .025, s * .039, 0, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = "#c57a70";
        ctx.fillRect(-s * .3, -s * .38, s * .6, s * .105);
        ctx.fillRect(s * .15, -s * .36, s * .12, s * .34);
        ctx.fillStyle = "#d4a399";
        for (const side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(side * s * .22, -s * .52, s * .062, s * .025, 0, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
      }

      function drawSnow(time, animate) {
        for (const flake of flakes) {
          const sway = Math.sin(time * .0004 + flake.phase) * flake.drift;
          const y = animate ? (flake.y + time * flake.speed * .035) % (height + 8) : flake.y;
          const x = (flake.x + sway + width) % width;
          ctx.globalAlpha = flake.alpha;
          ctx.fillStyle = "#f3f4e9";
          ctx.beginPath();
          ctx.arc(x, y, flake.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function paint(time) {
        ctx.clearRect(0, 0, width, height);
        drawStars(time);
        drawMoon();
        drawHills();
        drawVillage();
        drawTree(time);
        drawGifts();
        drawSnowCat();
        drawSnow(time, !reducedMotion.matches);
      }

      function animate(time) {
        lightStrength = reducedMotion.matches ? Number(lightsOn) : lightStrength + (Number(lightsOn) - lightStrength) * .075;
        paint(time);
        if (!reducedMotion.matches && sceneVisible && !document.hidden) frame = window.requestAnimationFrame(animate);
      }

      lightButton.addEventListener("click", () => {
        lightsOn = !lightsOn;
        lightButton.setAttribute("aria-pressed", String(lightsOn));
        lightLabel.textContent = lightsOn ? "为你亮着，再点可熄灯" : "点亮这棵树";
        document.querySelector(".hero-subtitle").textContent = lightsOn
          ? "夏鸣，圣诞快乐。愿这盏为你亮起的灯，陪你度过每一个平凡又珍贵的日子。"
          : "把冬夜的星星挂上枝头，把想对你说的话，藏进这棵圣诞树里。";
        if (frame) window.cancelAnimationFrame(frame);
        frame = window.requestAnimationFrame(animate);
      });

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2600);
      }

      shareButton.addEventListener("click", async () => {
        const shareData = {
          title: document.title,
          text: "江小唐给夏鸣的圣诞祝福",
          url: window.location.href
        };
        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(window.location.href);
            showToast("祝福链接已复制，可以发给夏鸣了。 ");
          } else {
            showToast("网站发布后，就可以把地址分享给夏鸣了。 ");
          }
        } catch (error) {
          if (error.name !== "AbortError") showToast("暂时无法分享，请稍后再试。 ");
        }
      });

      const soundButton = document.querySelector(".sound-button");
      const soundLabel = document.querySelector(".sound-label");
      // A synthesized music-box arrangement of the public-domain Jingle Bells melody.
      // Audio only starts in response to a click, with a gentle volume ceiling.
      let audioContext;
      let musicTimer;
      let musicPlaying = false;
      const melody = [
        [76,1],[76,1],[76,2],[76,1],[76,1],[76,2],
        [76,1],[79,1],[72,1.5],[74,.5],[76,4],
        [77,1],[77,1],[77,1.5],[77,.5],[77,1],[76,1],[76,1],[76,.5],[76,.5],
        [76,1],[74,1],[74,1],[76,1],[74,2],[79,2],
        [76,1],[76,1],[76,2],[76,1],[76,1],[76,2],
        [76,1],[79,1],[72,1.5],[74,.5],[76,4],
        [77,1],[77,1],[77,1.5],[77,.5],[77,1],[76,1],[76,1],[76,.5],[76,.5],
        [79,1],[79,1],[77,1],[74,1],[72,4],[0,4]
      ];
      function bell(note, start, length, volume = .045) {
        if (!note) return;
        const oscillator = audioContext.createOscillator();
        const overtone = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = "sine";
        overtone.type = "sine";
        const frequency = 440 * Math.pow(2, (note - 69) / 12);
        oscillator.frequency.value = frequency;
        overtone.frequency.value = frequency * 2.005;
        const overtoneGain = audioContext.createGain();
        overtoneGain.gain.value = .16;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(volume, start + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, start + length);
        oscillator.connect(gain);
        overtone.connect(overtoneGain);
        overtoneGain.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(start); overtone.start(start);
        oscillator.stop(start + length); overtone.stop(start + length);
        oscillator.onended = () => { oscillator.disconnect(); overtone.disconnect(); overtoneGain.disconnect(); gain.disconnect(); };
      }
      soundButton.addEventListener("click", async () => {
        try {
          if (musicPlaying) {
            window.clearTimeout(musicTimer);
            await audioContext.suspend();
          } else {
            audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
            await audioContext.resume();
            let noteIndex = 0;
            const playNote = () => {
              const [note, beats] = melody[noteIndex];
              bell(note, audioContext.currentTime + .025, Math.max(.7, beats * .45));
              if (noteIndex % 4 === 0) bell(noteIndex % 8 === 0 ? 48 : 55, audioContext.currentTime + .025, 1.7, .018);
              noteIndex = (noteIndex + 1) % melody.length;
              musicTimer = window.setTimeout(playNote, beats * 420);
            };
            playNote();
          }
          musicPlaying = !musicPlaying;
          soundButton.setAttribute("aria-pressed", String(musicPlaying));
          soundButton.setAttribute("aria-label", musicPlaying ? "暂停圣诞音乐" : "播放圣诞音乐");
          soundLabel.textContent = musicPlaying ? "暂停音乐" : "听见圣诞";
        } catch {
          showToast("当前浏览器暂时无法播放音乐，祝福仍在这里。 ");
        }
      });

      window.addEventListener("resize", resize, { passive: true });
      new IntersectionObserver(([entry]) => {
        sceneVisible = entry.isIntersecting;
        if (frame) window.cancelAnimationFrame(frame);
        if (sceneVisible && !reducedMotion.matches) frame = window.requestAnimationFrame(animate);
      }).observe(hero);
      document.addEventListener("visibilitychange", () => {
        if (frame) window.cancelAnimationFrame(frame);
        if (!document.hidden && sceneVisible && !reducedMotion.matches) frame = window.requestAnimationFrame(animate);
      });
      reducedMotion.addEventListener("change", () => {
        if (frame) window.cancelAnimationFrame(frame);
        frame = window.requestAnimationFrame(animate);
      });
      resize();
      if (!reducedMotion.matches) frame = window.requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
